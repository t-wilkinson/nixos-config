# Colors follow the wallpaper: matugen writes ~/.local/state/theme/hyprland.conf
# (config/matugen/templates/hyprland.conf), with border, background and hyprbars colors and
# the variables used below. `theme-wallpaper` regenerates it and runs `hyprctl reload`.
source = ~/.local/state/theme/hyprland.conf

# exec = export SLURP_ARGS='-d -c C5E7FFBB -b 2B4D6144 -s 00000000'

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = $on_surface, 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = $on_surface, 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = $on_surface, 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color $primary $outline, match:pin 1
