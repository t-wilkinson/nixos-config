# Bar, wallpaper
exec-once = awww-daemon --format xrgb
# exec-once = /usr/lib/geoclue-2.0/demos/agent & gammastep
exec-once = qs -n -d # Quickshell (config/quickshell); AGS fallback: run_ags

# Input method
exec-once = fcitx5

# Password manager and SSH agent (Settings -> "Enable SSH agent", and "Start to tray")
exec-once = bitwarden

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk
# exec-once = hyprpm reload # plugins come from Nix now (~/.local/share/hypr/plugins.conf)

# Audio
exec-once = easyeffects --gapplication-service

# Main applications
exec-once = firefox
exec-once = kitty zellij a -c main
exec-once = steam

# Clipboard: history
# exec-once = wl-paste --watch cliphist store &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

